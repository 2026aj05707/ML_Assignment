name: Keep Streamlit app awake

# Streamlit Community Cloud sleeps apps after a period of no traffic.
# This visits the app every 4 hours and clicks the wake-up button if it is asleep.
on:
  schedule:
    - cron: "0 */4 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Visit app and wake it if sleeping
        env:
          APP_URL: https://mlassignment-gnqwmgawx9d7ibsvh7b9u3.streamlit.app
        run: |
          python - <<'PY'
          import os, re
          from playwright.sync_api import sync_playwright

          url = os.environ["APP_URL"]
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              page.goto(url, wait_until="domcontentloaded", timeout=60000)
              page.wait_for_timeout(10000)
              wake = page.get_by_role("button", name=re.compile("get this app back up", re.I))
              if wake.count() > 0:
                  print("App was asleep - clicking wake-up button")
                  wake.first.click()
                  page.wait_for_timeout(60000)
              else:
                  print("App is awake")
              browser.close()
          PY
